name: Đăng bài lên Facebook Page

on:
  push:
    branches: [main]
    paths:
      - 'content/posts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài thư viện
        run: npm ci --ignore-scripts

      - name: Đăng các bài có publish=true và chưa đăng
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/facebook-post.mjs

      - name: Lưu trạng thái đã đăng
        run: |
          if git diff --quiet -- content/posts; then
            echo "Không có thay đổi."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts
          git commit -m "Cập nhật trạng thái đăng Facebook [skip ci]"
          git pull --rebase
          git push
